<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study OS — Your Study Companion</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-page { min-height: 100vh; }
  </style>
</head>
<body>

<div class="auth-page">
  <!-- Hero Side -->
  <div class="auth-hero">
    <div class="hero-logo">
      <div class="hero-logo-icon">📖</div>
      <span class="hero-logo-text">Study OS</span>
    </div>

    <div class="hero-content">
      <h1>Study <em>smarter,</em><br>not harder.</h1>
      <p>Organise your subjects, track every session, and build the daily habit that gets you to your goals.</p>
    </div>

    <div class="hero-stats">
      <div class="hero-stat">
        <span class="hero-stat-num">∞</span>
        <span class="hero-stat-label">Subjects</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-num">⏱</span>
        <span class="hero-stat-label">Timer</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-num">🔥</span>
        <span class="hero-stat-label">Streaks</span>
      </div>
    </div>
  </div>

  <!-- Form Side -->
  <div class="auth-form-side">
    <div class="auth-form-container">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="signup">Create Account</button>
      </div>

      <!-- Login Form -->
      <div class="auth-form active" id="login-form">
        <h2>Welcome back</h2>
        <p class="subtitle">Pick up right where you left off.</p>

        <div class="auth-error" id="login-error"></div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" id="login-btn">Sign In</button>
      </div>

      <!-- Signup Form -->
      <div class="auth-form" id="signup-form">
        <h2>Start your journey</h2>
        <p class="subtitle">Free forever. No credit card required.</p>

        <div class="auth-error" id="signup-error"></div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="Your name" autocomplete="name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary" id="signup-btn">Create Account</button>
      </div>

      
    </div>
  </div>
</div>

<script type="module">
import { initTheme } from './ui.js';
import { signIn, signUp, initAuth } from './auth.js';

// Init theme
initTheme();

// Check if already logged in
(async () => {
  const user = await initAuth();
  if (user) window.location.href = 'dashboard.html';
})();

// Tab switching
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + '-form').classList.add('active');
  });
});

// Login
document.getElementById('login-btn').addEventListener('click', async () => {
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  errEl.classList.remove('show');
  if (!email || !password) { errEl.textContent = 'Please fill in all fields.'; errEl.classList.add('show'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>';
  try {
    await signIn(email, password);
    window.location.href = 'dashboard.html';
  } catch (e) {
    errEl.textContent = e.message || 'Login failed. Check your credentials.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

// Signup
document.getElementById('signup-btn').addEventListener('click', async () => {
  const btn = document.getElementById('signup-btn');
  const errEl = document.getElementById('signup-error');
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;

  errEl.classList.remove('show');
  if (!name || !email || !password) { errEl.textContent = 'Please fill in all fields.'; errEl.classList.add('show'); return; }
  if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.classList.add('show'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>';
  try {
    await signUp(email, password, name);
    // Auto sign in after signup
    await signIn(email, password);
    window.location.href = 'dashboard.html';
  } catch (e) {
    errEl.textContent = e.message || 'Signup failed. Try again.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
});

// Enter key support
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const loginForm = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  if (loginForm.classList.contains('active')) document.getElementById('login-btn').click();
  else if (signupForm.classList.contains('active')) document.getElementById('signup-btn').click();
});
</script>
</body>
</html>
